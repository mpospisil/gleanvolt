name: CI

on:
  pull_request:
    branches: [main, 'release/**']
  push:
    branches: [main, 'release/**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Gleanvolt.slnx

      - name: Build
        run: dotnet build Gleanvolt.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Gleanvolt.slnx --no-build --configuration Release

      # The .deb's maintainer scripts and the installer run as root on someone else's machine, and are
      # otherwise exercised only by a release. shellcheck is preinstalled on the Ubuntu runners.
      - name: Lint the Linux packaging scripts
        run: shellcheck -s sh packaging/linux/install.sh packaging/linux/scripts/*.sh
