name: Release

# Turns a v* tag into a GitHub Release carrying everything a user might want that is not a container
# image: ready-to-run binaries for people who do not use Docker, and the library packages.
#
# There is deliberately no package feed. The libraries are packed -- it is a cheap check that the
# package metadata is coherent, and it produces the artifact if a feed is ever wanted -- but they are
# attached to the release rather than pushed anywhere. A private consumer takes this repository as a
# git submodule and references the projects directly, which needs no feed and no credentials.
#
# The image is published separately by publish-image.yml, from the same tag.
#
# Self-contained means "no .NET installed on the target": the runtime ships inside. That is what makes
# the win-x64 build usable by someone who has never heard of .NET, which the container images cannot
# serve.

on:
  push:
    tags: ['v*']
  # For proving a change to this workflow without cutting a release: it builds, tests, packs and
  # uploads the artifacts, and creates no release.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Release notes are generated from the log since the previous tag, which needs the history
          # and the tags -- actions/checkout fetches neither by default.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The git tag without its leading v on a release; the Directory.Build.props placeholder
      # otherwise, so a dispatch build is self-evidently not a release. Same derivation as
      # publish-image.yml, deliberately -- the package, the image and the tag are one number.
      - name: Derive the version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0-dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        run: |
          dotnet build Gleanvolt.slnx --configuration Release \
            -p:Version=${{ steps.version.outputs.version }} \
            -p:SourceRevisionId=${{ github.sha }}

      # ci.yml is the gate for a branch, but a release is permanent in a way a branch build is not.
      # One more run before something gets a version number is cheap.
      - name: Test
        run: dotnet test Gleanvolt.slnx --no-build --configuration Release

      # Each project by name rather than the solution: packing the solution warns about the projects
      # that are deliberately not packable, and an explicit list states what this repo publishes.
      - name: Pack the libraries
        run: |
          set -euo pipefail
          for project in Gleanvolt.Core Gleanvolt.Infrastructure Gleanvolt.Web Gleanvolt.Hosting; do
            dotnet pack "src/$project/$project.csproj" --no-build --configuration Release \
              -p:Version=${{ steps.version.outputs.version }} \
              -p:SourceRevisionId=${{ github.sha }} \
              --output artifacts
          done

      # The three targets someone would actually run this on: a Windows PC or NAS, a Raspberry Pi,
      # and an x64 Linux box. Self-contained so none of them needs a .NET install.
      #
      # Not --no-build: each runtime identifier is a different build, and the solution build above was
      # portable. Trimming is off on purpose -- the configuration binder and the options types are
      # resolved reflectively, and a trimmed build fails at startup rather than at compile time.
      - name: Publish self-contained binaries
        run: |
          set -euo pipefail
          for rid in win-x64 linux-x64 linux-arm64; do
            out="publish/$rid"
            dotnet publish src/Gleanvolt.Worker/Gleanvolt.Worker.csproj \
              --configuration Release \
              --runtime "$rid" \
              --self-contained true \
              -p:Version=${{ steps.version.outputs.version }} \
              -p:SourceRevisionId=${{ github.sha }} \
              --output "$out"

            # The terms travel with this artifact too, exactly as they do with the images and the
            # packages -- a zip someone downloads is the least likely of the three to be traced back
            # to the repository.
            cp LICENSE LICENSE-MIT THIRD-PARTY-NOTICES.md README.md "$out/"

            (cd publish && zip -qr "../artifacts/gleanvolt-${{ steps.version.outputs.version }}-$rid.zip" "$rid")
          done
          ls -l artifacts

      - name: Upload the artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: artifacts/*

      # Only from a tag. A workflow_dispatch run stops above, having proven everything except this.
      - name: Create the GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          previous=$(git describe --tags --abbrev=0 "${GITHUB_REF_NAME}^" 2>/dev/null || true)

          {
            echo "## Install"
            echo
            echo '```'
            echo "docker pull ghcr.io/${GITHUB_REPOSITORY,,}:${VERSION}"
            echo '```'
            echo
            echo "Or download a self-contained build below and run it — no .NET installation needed."
            echo "\`gleanvolt-${VERSION}-win-x64.zip\` for Windows, \`linux-arm64\` for a Raspberry Pi,"
            echo "\`linux-x64\` for an x64 Linux host or NAS."
            echo
            echo "The \`.nupkg\` files are the libraries, for building on the controller directly."
            echo "They are attached here rather than pushed to a feed."
            echo
            echo "## Changes"
            echo
            if [ -n "$previous" ]; then
              git log --no-merges --pretty='- %s' "${previous}..${GITHUB_REF_NAME}"
            else
              echo "First tagged release."
            fi
            echo
            echo "**Licence:** free for any noncommercial purpose under the PolyForm Noncommercial"
            echo "License 1.0.0. Commercial use requires a separate licence — see LICENSE."
          } > notes.md

          gh release create "${GITHUB_REF_NAME}" \
            --title "Gleanvolt ${VERSION}" \
            --notes-file notes.md \
            artifacts/*
