# Production broker configuration (issue #26).
#
# Unlike the dev stack at dev/homeassistant/, this broker requires authentication: the MQTT topics
# carry runtime control (the charge-mode select, the battery-hold switch), so an unauthenticated
# broker would let anything on the LAN operate the inverter and charger.
#
# This directory mirrors the Pi's: deploy.sh copies it to /opt/solax/mosquitto/config/.

listener 1883

# The password file is created out-of-band and is NOT in git -- see deploy/README.md:
#   docker run --rm -v /opt/solax/mosquitto/config:/mosquitto/config eclipse-mosquitto:2 \
#     mosquitto_passwd -c -b /mosquitto/config/passwd solax '<password>'
allow_anonymous false
password_file /mosquitto/config/passwd

# Retained messages and session state survive a restart, so Home Assistant's entities repopulate
# from the retained discovery configs rather than waiting for the controller's next publish.
persistence true
persistence_location /mosquitto/data/

# Log to stdout so `docker logs` (size-capped in docker-compose.yml) owns retention, rather than the
# broker writing a second, unrotated log onto the SD card.
log_dest stdout
