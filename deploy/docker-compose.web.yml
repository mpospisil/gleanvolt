# Redundant since the UI became on-by-default, and empty since the controller moved to the host's
# network (issue #268): there is no port to publish any more. It is kept, and still copied to the Pi on
# every deploy, for one reason only -- a Pi whose .env carries
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.web.yml
#
# from an earlier release would fail every `docker compose` command with "no such file" if it
# vanished. Merging it changes nothing.
#
# Nothing new should reference it. Delete the COMPOSE_FILE line from .env when convenient and this
# file stops being loaded at all.

services:
  gleanvolt-controller: {}
