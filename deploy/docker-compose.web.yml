# Redundant since the UI became on-by-default: docker-compose.yml publishes the port itself, so
# nothing has to merge this file any more. It is kept, and still copied to the Pi on every deploy,
# for one reason only -- a Pi whose .env carries
#
#   COMPOSE_FILE=docker-compose.yml:docker-compose.web.yml
#
# from an earlier release would fail every `docker compose` command with "no such file" if it
# vanished. Merging it changes nothing: the mapping below is the same one docker-compose.yml already
# declares, and Compose collapses the two into one published port.
#
# Nothing new should reference it. Delete the COMPOSE_FILE line from .env when convenient and this
# file stops being loaded at all.

services:
  gleanvolt-controller:
    ports:
      - "${WEB_PORT:-8090}:${WEB_PORT:-8090}"
