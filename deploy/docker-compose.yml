# Production stack for the Raspberry Pi (issue #26). Home Assistant and MQTT are opt-in
# (issue #51) -- the controller and its self-hosted UI run on their own.
#
# Deployed to /opt/gleanvolt on the Pi by deploy/deploy.sh or deploy/deploy-controller-only.sh; every
# relative path below therefore resolves under /opt/gleanvolt. Values come from /opt/gleanvolt/.env (see
# .env.example) -- that file stays on the Pi and is never committed.
#
#   ./deploy/deploy.sh                        # full stack, from a developer machine
#   ./deploy/deploy-controller-only.sh        # controller only, from a developer machine
#   docker compose ps                         # on the Pi, in /opt/gleanvolt
#
# Every byte of state lives on a bind mount below. The containers themselves are disposable:
# `docker compose down` and `docker rm -f` are safe, and an image upgrade or rollback loses nothing.
#
# Home Assistant and mosquitto carry `profiles:` and start only when requested -- both deploy scripts
# set COMPOSE_PROFILES explicitly for their own invocations (see deploy/_lib.sh), overriding whatever
# is in .env; running `docker compose` directly on the Pi instead falls back to .env's own
# COMPOSE_PROFILES, or `docker compose --profile ... up -d`. gleanvolt-controller never depends on either
# being present: HomeAssistant:Enabled is its own switch (HOMEASSISTANT_ENABLED below), off by
# default, so a controller-only run neither starts nor waits on a broker that was never asked for. See
# deploy/README.md's "Running without Home Assistant".

name: solax

services:
  # The broker is deliberately NOT published to the LAN -- no `ports:` entry. Only the other two
  # services reach it, over this compose network. Authentication is on regardless (mosquitto.conf),
  # so a future decision to expose it doesn't silently open the control topics.
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: gleanvolt-mosquitto
    restart: unless-stopped
    profiles: ["mosquitto"]
    volumes:
      # Config is read-only to the broker; the password file is created out-of-band, see README.
      - ./mosquitto/config:/mosquitto/config:ro
      - ./mosquitto/data:/mosquitto/data
    mem_limit: ${MOSQUITTO_MEM_LIMIT:-48m}
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  gleanvolt-controller:
    image: ghcr.io/mpospisil/gleanvolt:${IMAGE_TAG:-latest}
    container_name: gleanvolt-controller
    # `on-failure`, not `unless-stopped`, so that "Stop service" in the web UI (or the Home Assistant
    # button) actually stops it: the container must stay down until somebody starts it again, and a
    # policy that restarts on any exit would bring it straight back a second later.
    #
    # The exit code carries the difference, which is why the app sets one deliberately (HostShutdown):
    #
    #   0    an operator asked for the stop -> stays down until `docker compose start gleanvolt-controller`
    #   143  SIGTERM: a Pi reboot, a Docker daemon restart, `docker compose restart` -> comes back
    #   any other non-zero / killed  a crash or a power cut -> comes back
    #
    # That last column is the reason this is safe on a box that loses power: everything except a
    # deliberate stop is still restarted, including at daemon start after an unclean shutdown.
    # `docker compose stop` also stays stopped -- a manually stopped container ignores the policy
    # entirely, whatever it exited with.
    restart: on-failure
    # Docker's default grace period is 10s, which would SIGKILL the container part-way through the one
    # thing a graceful stop exists to do -- releasing the charger. 60s because a real stop was measured
    # at 19s on a healthy system: a Modbus read already in flight when the stop arrives cannot notice
    # the cancellation until it times out, and an EV charger that has gone quiet costs 5 seconds per
    # unanswered exchange. The pause itself is separately bounded (ChargingControlCoordinator's
    # DefaultShutdownPauseTimeout), so this is headroom for the rest of the shutdown rather than a
    # deadline anything relies on. The Pi only pays it when a shutdown actually runs long.
    stop_grace_period: 60s
    # Soft dependency, not a hard one: HomeAssistant:Enabled (below) is what actually decides whether
    # the controller speaks MQTT at all, and a controller-only deployment carries no `mosquitto`
    # service to depend on in the first place. `required: false` starts this before mosquitto if the
    # `mosquitto` profile isn't active, rather than refusing to come up over an undefined dependency.
    depends_on:
      mosquitto:
        condition: service_started
        required: false
    environment:
      # ASP.NET Core's "__" convention maps onto appsettings.json sections, so anything in that file
      # can be overridden here without rebuilding the image.
      TZ: ${TZ:-Europe/Prague}

      # The installation: where the array is, what it faces, and which boxes it is made of (issue
      # #111). One section describes all of it, and the two device addresses keep the variable names
      # they always had -- what changed is the configuration key they are mapped onto, which is why
      # upgrading needs no edit to .env for them. Everything else here is optional: an unset value is
      # unset rather than zero, because a defaulted site is a site in the Atlantic facing north.
      Pv__Id: ${PV_ID:-}
      Pv__Name: ${PV_NAME:-}
      Pv__Address: ${PV_ADDRESS:-}
      Pv__Latitude: ${PV_LATITUDE:-}
      Pv__Longitude: ${PV_LONGITUDE:-}
      Pv__AzimuthDegrees: ${PV_AZIMUTH:-}
      Pv__TiltDegrees: ${PV_TILT:-}
      Pv__CapacityKwp: ${PV_CAPACITY_KWP:-}
      Pv__InverterCapacityKw: ${PV_INVERTER_CAPACITY_KW:-}
      Pv__LossFactor: ${PV_LOSS_FACTOR:-}
      Pv__InstallDate: ${PV_INSTALL_DATE:-}

      Pv__Inverter__Model: ${PV_INVERTER_MODEL:-SolaX X3-HYB-G4 PRO}
      Pv__Inverter__Host: ${INVERTER_HOST:-192.168.2.10}

      # A list, of which exactly one entry is supported -- a second is refused at startup rather than
      # silently ignored. The index is in the key rather than in .env so that an operator with one
      # charger never has to think about arrays.
      Pv__Chargers__0__Id: ${PV_CHARGER_ID:-charger}
      Pv__Chargers__0__Model: ${PV_CHARGER_MODEL:-SolaX X1/X3-HAC}
      Pv__Chargers__0__Host: ${EV_CHARGER_HOST:-192.168.2.6}

      # Off by default -- see .env.example. Turning it on means both this and the `mosquitto` (and
      # usually `homeassistant`) profiles need to agree, which is why .env.example ships them
      # together under one heading rather than as independent-looking settings.
      HomeAssistant__Enabled: ${HOMEASSISTANT_ENABLED:-false}
      HomeAssistant__BrokerHost: mosquitto     # compose-network name, not localhost
      HomeAssistant__BrokerPort: "1883"
      HomeAssistant__Username: ${MQTT_USERNAME:-}
      HomeAssistant__Password: ${MQTT_PASSWORD:-}

      # The unique-id root every Home Assistant entity is keyed by, pinned rather than defaulted
      # (issue #111). The application's own default is "take Pv__Id", which is what a system being set
      # up today wants; this file cannot use that default, because every deployment that already exists
      # was created with `solax_controller` and Home Assistant would treat a new root as a new set of
      # entities -- sensor.…_2, and every graph starting again.
      #
      # Topics, names and the device page all follow Pv__Id freely. This one does not, and a deployment
      # that genuinely wants to change it sets HA_RETIRE_DEVICE_ID to the old value at the same time so
      # the retained configs left behind are cleared. See the README's "Renaming what Home Assistant
      # sees" for the procedure that keeps the history.
      HomeAssistant__DeviceId: ${HA_DEVICE_ID:-solax_controller}
      HomeAssistant__RetireDeviceIds__0: ${HA_RETIRE_DEVICE_ID:-}

      # A topic prefix this installation used to publish on, cleared of its retained state on connect.
      # Set it once after the topics move -- for a deployment that predates Pv__Id, that is
      # "solax/solax_controller" -- and remove it again afterwards; it costs one publish per topic on
      # every connect for as long as it is set.
      HomeAssistant__RetireTopicPrefixes__0: ${HA_RETIRE_TOPIC_PREFIX:-}

      # Vehicle telemetry (issue #73). Reads the car's own SOC off MQTT; writes nothing, so there is no
      # dry-run and the worst a wrong topic can do is leave the dashboard's Vehicle card absent.
      #
      # Unlike HomeAssistant__BrokerHost above, this one is overridable rather than pinned to the
      # compose-network name. The car's data is *published* by Home Assistant, and under
      # deploy-controller-only.sh there is no mosquitto on this network at all -- so "the broker beside
      # us" is the common case, not the only one, and pointing this at the machine that does run Home
      # Assistant has to stay possible.
      #
      # The credentials are deliberately the same MQTT_USERNAME/MQTT_PASSWORD the block above uses:
      # publishing status to a broker and subscribing to it are the same broker in every deployment
      # this file describes, and a second pair of variables would only be a way to get them out of sync.
      Vehicle__Enabled: ${VEHICLE_ENABLED:-false}
      Vehicle__BrokerHost: ${VEHICLE_BROKER_HOST:-mosquitto}
      Vehicle__BrokerPort: ${VEHICLE_BROKER_PORT:-1883}
      Vehicle__Username: ${MQTT_USERNAME:-}
      Vehicle__Password: ${MQTT_PASSWORD:-}
      Vehicle__MaxAge: ${VEHICLE_MAX_AGE:-12:00:00}

      # The car read from VW's own EU Data Act portal (issues #137/#139/#140) -- the other way to fill
      # the same reading, and the only manufacturer integration in the codebase.
      #
      # VW_ENABLED is the feed: the portal read on the controller's own fifteen-minute clock. The
      # credentials alone only enable the web UI's "Vehicle portal" button, which is deliberate --
      # pressing it is how you prove them before anything signs in unattended.
      #
      # WITH VW_ENABLED=true THE MQTT VEHICLE FEED ABOVE IS NOT SUBSCRIBED. Two sources writing one
      # reading is a race; the manufacturer's service wins and the startup log says so.
      #
      # VW_PASSWORD is not a read-only credential: the same account unlocks and locates the car. What
      # protects it is that .env is gitignored and the client never logs or renders it. See
      # docs/VW_PORTAL_SETUP.md, which also covers the two browser steps no setting can replace.
      Vehicle__DataAct__Enabled: ${VW_ENABLED:-false}
      Vehicle__DataAct__Brand: ${VW_BRAND:-}
      Vehicle__DataAct__ClientId: ${VW_CLIENT_ID:-}
      Vehicle__DataAct__Username: ${VW_USERNAME:-}
      Vehicle__DataAct__Password: ${VW_PASSWORD:-}
      Vehicle__DataAct__Vin: ${VW_VIN:-}

      # How many of the portal's deliveries one read may merge (default 4). The portal splits a car
      # across report types, so a read keeps merging older deliveries while the reading is still short
      # of something. Raise it to reach further back for a field that has not appeared; each delivery
      # is one ZIP download.
      Vehicle__DataAct__MaxDatasetsPerRead: ${VW_MAX_DATASETS:-4}

      # The car's *usable* pack, which is what its own SOC is a percentage of (issue #99). Zero means
      # unconfigured, and costs exactly one thing: the targeted plan's "Battery target (%)" basis, which
      # cannot convert 80% into kilowatt-hours without it. Efficiency is charger-meter to cells -- not
      # the home battery's Forecast__ChargeEfficiency, which describes different hardware.
      # The car itself (issue #124). Separate from the Vehicle section above, which describes the
      # *feed* -- the broker, the credentials, how stale a reading may be. These describe the car, and
      # the last three are the ones the controller previously had to borrow from the charger's
      # settings: a single-phase car behind a three-phase wallbox had every power figure it reasoned
      # with overstated threefold.
      #
      # The .env variable names are unchanged from when these lived under Vehicle__, so an existing
      # .env keeps working untouched -- only the configuration key they feed has moved.
      Ev__Vehicles__0__Id: ${EV_ID:-}
      Ev__Vehicles__0__Name: ${EV_NAME:-}
      Ev__Vehicles__0__Make: ${EV_MAKE:-}
      Ev__Vehicles__0__Model: ${EV_MODEL:-}
      Ev__Vehicles__0__BatteryCapacityKWh: ${VEHICLE_BATTERY_CAPACITY_KWH:-0}
      Ev__Vehicles__0__ChargeEfficiency: ${VEHICLE_CHARGE_EFFICIENCY:-0.9}
      Ev__Vehicles__0__Phases: ${EV_PHASES:-}
      Ev__Vehicles__0__MinChargingCurrentAmps: ${EV_MIN_CHARGING_CURRENT_AMPS:-}
      Ev__Vehicles__0__MaxChargingCurrentAmps: ${EV_MAX_CHARGING_CURRENT_AMPS:-}
      Ev__Vehicles__0__Telemetry__Topic: ${VEHICLE_TOPIC:-gleanvolt/vehicle/state}

      Solcast__Enabled: ${SOLCAST_ENABLED:-true}
      Solcast__ApiKey: ${SOLCAST_API_KEY:-}
      Solcast__ResourceId: ${SOLCAST_RESOURCE_ID:-}

      # The weather each charging session ran in (issue #96). Entirely optional: with no key, or a site
      # with no coordinates, the controller makes no weather calls at all and sessions are recorded
      # without it. Two calls per session, so any free OpenWeatherMap plan covers it. Which site it asks
      # about is PV_LATITUDE/PV_LONGITUDE above -- where the array is is a fact about the array.
      Weather__ApiKey: ${WEATHER_API_KEY:-}

      # Deploying must not start writing to an inverter or charger. Charge control needs no flag for
      # that: the service always boots in mode Off and takes control only when a mode is selected
      # (Home Assistant or the web UI). The battery hold does, and stays disabled and dry-run unless
      # overridden in .env. Verify the register addresses on your own device before enabling either.
      ChargeControl__DryRun: ${CHARGE_CONTROL_DRY_RUN:-false}
      BatteryHold__Enabled: ${BATTERY_HOLD_ENABLED:-false}
      BatteryHold__DryRun: ${BATTERY_HOLD_DRY_RUN:-true}

      # The self-hosted UI (issue #44). On by default, and published below without anything in .env
      # having to say so: a fresh deploy must produce a working UI, not a container that needs two
      # more settings before it shows anything.
      #
      # Web__RequireAuthentication is deliberately NOT passed through as a default. Unset means
      # "follow the password": WEB_PASSWORD_HASH turns the login on, and no hash means an open UI on
      # the LAN. Setting WEB_REQUIRE_AUTHENTICATION=true without a hash is refused at startup --
      # nobody could sign in -- which is the one case worth failing loudly over.
      Web__Enabled: ${WEB_ENABLED:-true}
      Web__Port: ${WEB_PORT:-8090}
      Web__RequireAuthentication: ${WEB_REQUIRE_AUTHENTICATION:-}
      Web__PasswordHash: ${WEB_PASSWORD_HASH:-}

      # The HTTP API (issue #103). Off by default and, unlike the UI, never open: two of its endpoints
      # write to hardware and any program on the LAN can reach a port. Enabling it with no key set is
      # refused at startup rather than served.
      #
      # It shares the UI's port -- one appliance, one socket -- so nothing extra is published below.
      # The key's name is what appears in the log and in the recorded session as the source of an
      # action, so name it after the client. Add more Api__Keys__<name> lines here for more clients.
      Api__Enabled: ${API_ENABLED:-false}
      Api__Keys__client: ${API_KEY:-}
    ports:
      # Published unconditionally, which is why WEB_ENABLED=false is worth understanding: the port is
      # still bound on the host, but nothing inside the container listens on it (Program.cs replaces
      # the server outright), so connections are refused rather than served. Before this file
      # published anything, turning the UI on also meant merging docker-compose.web.yml via
      # COMPOSE_FILE -- a second, easily-forgotten step whose only symptom was an unreachable UI.
      - "${WEB_PORT:-8090}:${WEB_PORT:-8090}"
    volumes:
      # Serilog's rolling file sink. Must be chowned to the image's non-root uid (1654) on the host.
      - ./logs:/app/logs
      # The two SQLite stores under the content root: the charging sessions (SessionStore:Path,
      # "data/sessions.db") and the site's energy history (EnergyMonitor:Path, "data/energy.db").
      # The only irreplaceable things this service produces -- telemetry can be re-polled, a
      # recorded session cannot be re-lived and a quarter hour of March cannot be measured again --
      # so they must outlive the container. SQLite writes its -wal and -shm alongside each file, so
      # the *directory* has to be writable by uid 1654, not just the databases.
      - ./data:/app/data
    mem_limit: ${CONTROLLER_MEM_LIMIT:-512m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  homeassistant:
    image: ghcr.io/home-assistant/home-assistant:stable
    container_name: gleanvolt-homeassistant
    restart: unless-stopped
    profiles: ["homeassistant"]
    depends_on:
      mosquitto:
        condition: service_started
        required: false
    environment:
      TZ: ${TZ:-Europe/Prague}
    ports:
      - "8123:8123"
    volumes:
      # Holds .storage/ (account, entity registry, integration config) and the recorder database.
      # This is the one directory whose loss cannot be recovered from git -- back it up.
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    # HA is by far the hungriest of the three: ~500 MB in steady state on the reference install, and
    # it spikes above that during startup, an update, or a recorder purge. This is a hard cap, not a
    # reservation -- raising it does not make HA use more, it only stops the kernel killing it at a
    # bad moment, so the default is set well clear of the measured figure rather than just above it.
    # Lower it only on a board too small for the headroom, and see README.md for the recorder tuning
    # that brings the usage itself down. Bridge networking is enough -- HA only speaks MQTT here.
    mem_limit: ${HA_MEM_LIMIT:-1536m}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
